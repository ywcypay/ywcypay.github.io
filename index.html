<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橙羿科技</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e6f0fa, #f5faff);
            color: #333;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.8em;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        .sidebar {
            width: 35%;
            background: linear-gradient(45deg, #4facfe, #81ecec);
            padding: 40px;
            text-align: center;
            position: relative;
        }
        .photo img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .photo img:hover {
            transform: scale(1.05);
        }
        .content {
            width: 65%;
            padding: 40px;
            background: #f9fbfd;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            margin: 15px 0;
            font-size: 1.1em;
            padding: 12px;
            background: #e6f0fa;
            border-radius: 8px;
            transition: background 0.3s ease;
        }
        ul li:hover {
            background: #d1e3fa;
        }
        ul li strong {
            color: #4facfe;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .carousel {
            margin-top: 30px;
            text-align: center;
        }
        .carousel img {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            border: 2px solid #4facfe;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .carousel img:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Welcome to Our Company</h1>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="photo">
                <img src="your-photo.jpg" alt="网站完善ing...">
            </div>
        </div>
        <div class="content">
            <ul>
                <li><strong>Name:</strong> 义乌市橙羿科技有限公司</li>
                <li><strong>Phone Number:</strong> +1 9182060200</li>
                <li><strong>Email Address:</strong> yifanpay@outlook.com</li>
                <li><strong>Main Address:</strong> 浙江省义乌市北苑街道季宅一区133幢2单元201室(自主申报)</li>
            </ul>
            <div class="carousel">
                <img src="https://img0.baidu.com/it/u=1376884008,852813948&fm=253&fmt=auto&app=120&f=JPEG?w=1199&h=800" alt="Company Image">
            </div>
        </div>
    </div>
</body>
</html>
